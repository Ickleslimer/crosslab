name: CI

# The same two gates run here that the local pipeline trusts:
#   * the Python gate is byte-for-byte the command scripts/crosslab_sync.py
#     runs in its ephemeral env (isolated uv env built from pyproject.toml,
#     pytest + pytest-asyncio), so green locally means green here.
#   * the desktop gate is the SvelteKit app: npm ci -> vitest -> vite build.
# `npm run check` (svelte-check) is enforced as part of the desktop job:
# the three pre-existing type errors were fixed in the commit that added
# the step, and CI was kept honest (green before the job was enabled).
#
# Actions run on node24: checkout/setup-node publish moving major tags (v7),
# but setup-uv stopped publishing major tags after v7 — v8+ exist only as
# exact versions, hence the pinned v10.1.0 (bump it explicitly when updating).

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-gate:
    name: Python gate (ephemeral uv env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - name: Tests (clean ephemeral env from pyproject)
        run: >-
          uv run --isolated --with-editable . --with pytest --with pytest-asyncio --
          python -m pytest tests/ -q

  desktop:
    name: Desktop (svelte-check + vitest + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Type check (svelte-check)
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Production build (adapter-static)
        run: npm run build
