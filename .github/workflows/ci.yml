name: CI

# The same two gates run here that the local pipeline trusts:
#   * the Python gate runs ruff and mypy against pyproject.toml's explicit
#     [tool.ruff]/[tool.mypy] config, then the exact pytest command
#     scripts/crosslab_sync.py runs in its ephemeral env (isolated env from
#     pyproject.toml, pytest + pytest-asyncio) — so the test half of the gate
#     is green locally iff it is green here.
#   * the desktop gate is the SvelteKit app: npm ci -> vitest -> vite build.
# `npm run check` (svelte-check) is enforced as part of the desktop job:
# the three pre-existing type errors were fixed in the commit that added
# the step, and CI was kept honest (green before the job was enabled).
#
# Actions run on node24: checkout/setup-node publish moving major tags (v7),
# but setup-uv stopped publishing major tags after v7 — v8+ exist only as
# exact versions, hence the pinned v10.1.0. Version bumps are automated by
# .github/dependabot.yml, whose PRs run this same workflow as the gate.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-gate:
    name: Python gate (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      # Tool versions are pinned exactly: a new ruff release can add rules and
      # a new mypy can add checks, and this gate must not change underneath a
      # PR that touched nothing. Bumping is a deliberate edit here (Dependabot
      # cannot see `uv run --with` args, so it cannot do it for us).
      - name: Lint (ruff)
        run: uv run --isolated --with ruff==0.16.8 -- ruff check .
      - name: Type check (mypy)
        run: >-
          uv run --isolated --with-editable . --with pytest --with pytest-asyncio --
          --with mypy==2.3.1 -- mypy
      - name: Tests (clean ephemeral env from pyproject)
        run: >-
          uv run --isolated --with-editable . --with pytest --with pytest-asyncio --
          python -m pytest tests/ -q

  desktop:
    name: Desktop (svelte-check + vitest + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Type check (svelte-check)
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Production build (adapter-static)
        run: npm run build
